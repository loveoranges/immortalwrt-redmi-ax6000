name: Build Redmi AX6000 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "25.12.1"
  PROFILE: xiaomi_redmi-router-ax6000-ubootmod
  FIRMWARE: immortalwrt-25.12.1-mediatek-filogic-xiaomi_redmi-router-ax6000-ubootmod-squashfs-sysupgrade.itb
  PKG_ARCH: aarch64_cortex-a53
  # Official ImageBuilder image (IB already inside WORKDIR)
  # https://hub.docker.com/r/immortalwrt/imagebuilder
  IB_IMAGE: immortalwrt/imagebuilder:mediatek-filogic-openwrt-25.12.1
  EXTRA_PACKAGES: >-
    luci-app-passwall luci-i18n-passwall-zh-cn sing-box
    luci-app-ttyd luci-i18n-ttyd-zh-cn ttyd
    luci-app-ddns luci-i18n-ddns-zh-cn
    luci-app-vlmcsd luci-i18n-vlmcsd-zh-cn
    luci-app-nut luci-i18n-nut-zh-cn
    luci-app-upnp luci-i18n-upnp-zh-cn
    htop
    luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn
    iperf3

jobs:
  build:
    name: ImageBuilder
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Prepare custom packages
        run: |
          set -euo pipefail
          mkdir -p packages out
          # GuNanOvO smaller tailscale — always latest release
          # https://github.com/GuNanOvO/openwrt-tailscale
          ver="$(basename "$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/GuNanOvO/openwrt-tailscale/releases/latest)")"
          ver="${ver#v}"
          wget -q --show-progress \
            -O "packages/tailscale-${ver}-r1.apk" \
            "https://gunanovo.github.io/openwrt-tailscale/${PKG_ARCH}/tailscale-${ver}-r1.apk"
          ls -lah packages/
          # ImageBuilder runs as uid 1000 (build); allow write to bind mounts
          sudo chown -R 1000:1000 packages out

      - name: Build firmware
        run: |
          set -euo pipefail
          packages="$(echo "${EXTRA_PACKAGES}" | xargs)"
          echo "PROFILE=${PROFILE}"
          echo "PACKAGES=${packages}"
          docker run --rm \
            -v "${{ github.workspace }}/packages:/home/build/immortalwrt/packages" \
            -v "${{ github.workspace }}/out:/home/build/immortalwrt/bin" \
            "${IB_IMAGE}" \
            make image PROFILE="${PROFILE}" PACKAGES="${packages}"
          find out -type f | sort

      - name: Prepare release
        id: release
        run: |
          set -euo pipefail
          tag="${VERSION}-ubootmod-${{ github.run_number }}"
          src="$(find out -type f -name "${FIRMWARE}" | head -n1)"
          test -n "${src}" && test -f "${src}"
          mkdir -p release
          cp -a "${src}" "release/${FIRMWARE}"
          ls -lah "release/${FIRMWARE}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "file=release/${FIRMWARE}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE }}
          path: release/${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ImmortalWrt ${{ env.VERSION }} · AX6000 ubootmod (#${{ github.run_number }})
          files: ${{ steps.release.outputs.file }}
          fail_on_unmatched_files: true
          body: |
            ## Redmi AX6000 (ubootmod)

            | Item | Value |
            | --- | --- |
            | ImmortalWrt | `${{ env.VERSION }}` |
            | Profile | `${{ env.PROFILE }}` |
            | Image | `${{ env.IB_IMAGE }}` |
            | Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

            ### Packages

            ```
            ${{ env.EXTRA_PACKAGES }}
            ```
