name: Build Redmi AX6000 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: xiaomi_redmi-router-ax6000-ubootmod
  PKG_ARCH: aarch64_cortex-a53
  EXTRA_PACKAGES: >-
    luci-app-passwall luci-i18n-passwall-zh-cn sing-box
    luci-app-ttyd luci-i18n-ttyd-zh-cn ttyd
    luci-app-ddns luci-i18n-ddns-zh-cn
    luci-app-vlmcsd luci-i18n-vlmcsd-zh-cn
    luci-app-nut luci-i18n-nut-zh-cn
    luci-app-upnp luci-i18n-upnp-zh-cn
    htop
    luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn
    iperf3

jobs:
  build:
    name: ImageBuilder
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex g++ gawk gettext \
            libncurses5-dev libssl-dev rsync unzip zlib1g-dev zstd file

      - name: Resolve version
        run: |
          set -euo pipefail
          V="$(curl -fsSL https://downloads.immortalwrt.org/.versions.json | jq -r .stable_version)"
          IB="immortalwrt-imagebuilder-${V}-${TARGET}-${SUBTARGET}.Linux-x86_64"
          BASE="https://downloads.immortalwrt.org/releases/${V}/targets/${TARGET}/${SUBTARGET}"
          {
            echo "VERSION=${V}"
            echo "IB_DIR=${IB}"
            echo "IB_ARCHIVE=${IB}.tar.zst"
            echo "IB_BASE=${BASE}"
            echo "IB_URL=${BASE}/${IB}.tar.zst"
            echo "BIN_DIR=${IB}/bin/targets/${TARGET}/${SUBTARGET}"
            echo "FIRMWARE=immortalwrt-${V}-${TARGET}-${SUBTARGET}-${PROFILE}-squashfs-sysupgrade.itb"
          } >> "$GITHUB_ENV"

      - name: Cache ImageBuilder
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.IB_ARCHIVE }}
          key: ib-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

      - name: Setup ImageBuilder
        run: |
          set -euo pipefail
          if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            wget -q -O "${IB_ARCHIVE}" "${IB_URL}"
          fi
          wget -q -O sha256sums "${IB_BASE}/sha256sums"
          grep "${IB_ARCHIVE}" sha256sums | sha256sum -c -
          tar --zstd -xf "${IB_ARCHIVE}"

      - name: Build
        working-directory: ${{ env.IB_DIR }}
        run: |
          set -euo pipefail
          # GuNanOvO/openwrt-tailscale latest → packages/ (rename for apk/IB)
          mkdir -p packages
          url="$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/GuNanOvO/openwrt-tailscale/releases/latest" \
            | jq -r --arg a "$PKG_ARCH" \
              '.assets[]|select(.name|endswith("_"+$a+".apk") and startswith("tailscale_"))|.browser_download_url')"
          wget -q -O "packages/tailscale-$(basename "$url" | cut -d_ -f2)-r1.apk" "$url"
          make image PROFILE="${PROFILE}" PACKAGES="$(echo ${EXTRA_PACKAGES})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE }}
          path: ${{ env.BIN_DIR }}/${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}-ubootmod-${{ github.run_number }}
          name: ImmortalWrt ${{ env.VERSION }} · AX6000 ubootmod (#${{ github.run_number }})
          files: ${{ env.BIN_DIR }}/${{ env.FIRMWARE }}
          fail_on_unmatched_files: true
          body: |
            | Item | Value |
            | --- | --- |
            | ImmortalWrt | `${{ env.VERSION }}` |
            | Profile | `${{ env.PROFILE }}` |
            | Packages | `${{ env.EXTRA_PACKAGES }}` |
