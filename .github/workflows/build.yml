name: Build Redmi AX6000 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: xiaomi_redmi-router-ax6000-ubootmod
  PKG_ARCH: aarch64_cortex-a53
  EXTRA_PACKAGES: >-
    luci-app-passwall luci-i18n-passwall-zh-cn sing-box
    luci-app-ttyd luci-i18n-ttyd-zh-cn ttyd
    luci-app-ddns luci-i18n-ddns-zh-cn
    luci-app-vlmcsd luci-i18n-vlmcsd-zh-cn
    luci-app-nut luci-i18n-nut-zh-cn
    luci-app-upnp luci-i18n-upnp-zh-cn
    htop
    luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn
    iperf3
    luci-app-statistics luci-i18n-statistics-zh-cn
    collectd collectd-mod-cpu collectd-mod-interface
    collectd-mod-iwinfo collectd-mod-load collectd-mod-memory collectd-mod-network
    luci-app-wol luci-i18n-wol-zh-cn
    luci-app-watchcat luci-i18n-watchcat-zh-cn
    luci-app-sqm luci-i18n-sqm-zh-cn sqm-scripts
    luci-i18n-base-zh-cn
    tcpdump mtr-json bind-dig ethtool
    v2ray-geoip v2ray-geosite

jobs:
  build:
    name: ImageBuilder
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext libncurses5-dev \
            libssl-dev rsync unzip zlib1g-dev zstd file

      - name: Resolve version
        run: |
          set -euo pipefail
          V="$(curl -fsSL https://downloads.immortalwrt.org/.versions.json | jq -r .stable_version)"
          IB="immortalwrt-imagebuilder-${V}-${TARGET}-${SUBTARGET}.Linux-x86_64"
          BASE="https://downloads.immortalwrt.org/releases/${V}/targets/${TARGET}/${SUBTARGET}"
          {
            echo "VERSION=${V}"
            echo "IB_DIR=${IB}"
            echo "IB_ARCHIVE=${IB}.tar.zst"
            echo "IB_BASE=${BASE}"
            echo "IB_URL=${BASE}/${IB}.tar.zst"
          } >> "$GITHUB_ENV"

      - name: Cache ImageBuilder
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.IB_ARCHIVE }}
          key: ib-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

      - name: Setup ImageBuilder
        run: |
          set -euo pipefail
          if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            curl -fsSL --retry 3 -o "${IB_ARCHIVE}" "${IB_URL}"
          fi
          curl -fsSL -o sha256sums "${IB_BASE}/sha256sums"
          grep "${IB_ARCHIVE}" sha256sums | sha256sum -c -
          tar --zstd -xf "${IB_ARCHIVE}"

      - name: Build
        working-directory: ${{ env.IB_DIR }}
        run: |
          set -euo pipefail

          # GuNanOvO/openwrt-tailscale latest → packages/ (apk name must be name-ver-rN.apk)
          mkdir -p packages
          url="$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/GuNanOvO/openwrt-tailscale/releases/latest" \
            | jq -r --arg a "$PKG_ARCH" \
              '.assets[]|select(.name|endswith("_"+$a+".apk") and startswith("tailscale_"))|.browser_download_url')"
          ver="$(basename "$url" | cut -d_ -f2)"
          curl -fsSL -o "packages/tailscale-${ver}-r1.apk" "$url"

          make image PROFILE="${PROFILE}" PACKAGES="${EXTRA_PACKAGES}"

          fw="$(find "bin/targets/${TARGET}/${SUBTARGET}" -maxdepth 1 -type f \
            -name "*${PROFILE}*squashfs-sysupgrade*" | head -n1)"
          test -f "${fw}"
          mkdir -p "${GITHUB_WORKSPACE}/release"
          cp -a "${fw}" "${GITHUB_WORKSPACE}/release/"
          echo "FIRMWARE_FILE=$(basename "${fw}")" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_FILE }}
          path: release/${{ env.FIRMWARE_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}-ubootmod-${{ github.run_number }}
          name: ImmortalWrt ${{ env.VERSION }} · AX6000 ubootmod (#${{ github.run_number }})
          files: release/${{ env.FIRMWARE_FILE }}
          fail_on_unmatched_files: true
          body: |
            | Item | Value |
            | --- | --- |
            | ImmortalWrt | `${{ env.VERSION }}` |
            | Profile | `${{ env.PROFILE }}` |
            | Packages | `${{ env.EXTRA_PACKAGES }}` |
